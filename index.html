<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kepokkaw Cashier</title>
<meta name="theme-color" content="#E1251B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kepokkaw">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
@font-face{font-family:'Barlow';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/barlow-400.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-600.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-700.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700 800;font-style:italic;font-display:swap;src:url(fonts/barlow-condensed-800i.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-weight:700 800;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-800.woff2) format('woff2')}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* Layout: red brand bar + checker strip on top; cashier = tile grid left, ticket right; other views = single scrolling column */
:root{
  --red:#E1251B; --red-deep:#B3170F; --on-red:#FFFFFF;
  --bg:#F3EFEE; --surface:#FFFFFF; --surface-2:#F8F4F3; --ink:#1B1413; --muted:#6E6361; --line:#E3DBD9;
  --good:#1D8048; --warn:#B86E00; --bad:#C62828; --exp:#4A3F3D;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --red:#EE3A2F; --red-deep:#C4231A; --on-red:#FFFFFF;
  --bg:#130F0E; --surface:#1D1716; --surface-2:#262020; --ink:#F4EEEC; --muted:#A89C99; --line:#382E2C;
  --good:#45BF7A; --warn:#E8A33A; --bad:#F26B6B; --exp:#BFB3B0; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --red:#EE3A2F; --red-deep:#C4231A; --on-red:#FFFFFF;
  --bg:#130F0E; --surface:#1D1716; --surface-2:#262020; --ink:#F4EEEC; --muted:#A89C99; --line:#382E2C;
  --good:#45BF7A; --warn:#E8A33A; --bad:#F26B6B; --exp:#BFB3B0; color-scheme:dark;
}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}

/* top bar */
.top{background:var(--red);color:var(--on-red);display:flex;align-items:center;gap:14px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));flex-wrap:wrap;-webkit-user-select:none;user-select:none}
.brand{font-family:var(--display);font-style:italic;font-weight:800;font-size:25px;line-height:.82;text-transform:uppercase;letter-spacing:.01em}
.brand small{display:block;font-size:10px;font-style:normal;font-weight:700;letter-spacing:.14em;opacity:.85;margin-top:3px}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tabs button{background:transparent;border:0;color:var(--on-red);opacity:.82;font-weight:600;font-size:15px;padding:10px 14px;border-radius:999px;white-space:nowrap}
.tabs button.on{background:var(--on-red);color:var(--red);opacity:1}
.who{display:flex;align-items:center;gap:8px}
.role{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1.5px solid var(--on-red);border-radius:999px;padding:5px 10px}
.lock{background:var(--red-deep);border:0;color:var(--on-red);font-weight:600;padding:9px 14px;border-radius:999px}
.checker{height:10px;flex:none;background:repeating-conic-gradient(var(--red) 0 25%,var(--on-red) 0 50%) 0 0/20px 20px}
.sample{background:var(--surface);border-bottom:1px solid var(--line);color:var(--muted);font-size:13px;padding:8px 16px}
.sample b{color:var(--ink)}
main{flex:1;min-height:0;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}

/* cashier */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;height:100%}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:start}
.tile{position:relative;min-height:156px;border:0;border-radius:18px;background:var(--surface);text-align:left;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;box-shadow:inset 0 0 0 1px var(--line);user-select:none;-webkit-user-select:none;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile.in{box-shadow:inset 0 0 0 3px var(--red)}
.tile.out{opacity:.45}
.sw{width:42px;height:42px;border-radius:50%;background:var(--sw);box-shadow:inset 0 -6px 0 rgba(0,0,0,.14)}
.tname{font-family:var(--display);font-weight:800;font-style:italic;font-size:30px;line-height:.92;text-transform:uppercase;text-wrap:balance}
.tmeta{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tprice{font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.tstock{font-size:13px;color:var(--muted);font-weight:600}
.tstock.low{color:var(--warn)}
.badge{position:absolute;top:12px;right:12px;min-width:42px;height:42px;border-radius:21px;background:var(--red);color:var(--on-red);font-family:var(--display);font-weight:800;font-size:24px;display:grid;place-items:center;padding:0 8px}
.ticket{position:relative;background:var(--surface);border-radius:18px;display:flex;flex-direction:column;min-height:0;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.ticket-head{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 10px;border-bottom:1px dashed var(--line)}
.ticket-head h2{margin:0;font-family:var(--display);font-style:italic;font-weight:800;font-size:24px;text-transform:uppercase}
.ticket-head span{color:var(--muted);font-size:13px;font-weight:600}
.lines{flex:1;overflow:auto;padding:4px 16px;min-height:120px}
.empty{color:var(--muted);text-align:center;padding:32px 8px;font-size:14px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.lname{font-weight:700;font-size:16px}
.lsub{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:6px}
.step button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:600;line-height:1}
.step b{min-width:26px;text-align:center;font-size:18px;font-variant-numeric:tabular-nums}
.sum{padding:14px 16px 16px;border-top:1px solid var(--line);display:grid;gap:12px}
.sum-row{display:flex;justify-content:space-between;align-items:baseline}
.sum-row span{color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.amt{font-family:var(--display);font-weight:800;font-size:50px;line-height:1;font-variant-numeric:tabular-nums}
.go{width:100%;height:64px;border:0;border-radius:14px;background:var(--red);color:var(--on-red);font-family:var(--display);font-weight:800;font-style:italic;font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.go:disabled{opacity:.35;cursor:default}
.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600}

/* generic */
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:16px}
.h1{font-family:var(--display);font-style:italic;font-weight:800;font-size:34px;text-transform:uppercase;margin:0;line-height:1}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.panel{background:var(--surface);border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);padding:16px;min-width:0}
.panel h3{margin:0 0 12px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);padding:14px 16px}
.stat span{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:4px}
.stat small{color:var(--muted);font-size:13px}
.pos-v{color:var(--good)} .neg-v{color:var(--bad)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 8px}
.pill.void{background:var(--bad);color:var(--on-red)}
.pill.low{background:var(--warn);color:var(--on-red)}
.pill.ok{background:var(--good);color:var(--on-red)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* charts */
.chart{position:relative;padding-top:18px}
.chart .max{position:absolute;top:0;left:0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bars{position:relative;display:flex;align-items:stretch;gap:4px;height:170px;border-bottom:1px solid var(--line);background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 50%}
.bcol{flex:1;min-width:0;display:flex;align-items:flex-end;gap:2px}
.bcol i{flex:1;display:block;border-radius:3px 3px 0 0;min-height:1px}
.bcol i.s{background:var(--red)} .bcol i.e{background:var(--exp)}
.xl{display:flex;gap:4px;margin-top:6px}
.xl span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.hrow{display:grid;grid-template-columns:110px minmax(0,1fr) 90px;gap:10px;align-items:center;padding:6px 0}
.hrow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .tr{height:14px;background:var(--surface-2);border-radius:7px;overflow:hidden}
.hrow .tr i{display:block;height:100%;border-radius:7px}
.hrow .v{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.hrow .v small{display:block;color:var(--muted);font-size:12px}

.trend{display:block;font-size:12px;font-weight:600;margin-top:2px}
.trend.up{color:var(--good)} .trend.down{color:var(--bad)}
.tline{position:absolute;left:0;right:0;border-top:2px dashed var(--ink);opacity:.6;pointer-events:none}
.tline span{position:absolute;right:0;top:-17px;font-size:11px;font-weight:700;color:var(--ink)}
.prog{height:16px;background:var(--surface-2);border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.prog i{display:block;height:100%;background:var(--good);border-radius:8px}
.tablewrap{overflow-x:auto}
.mt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.mt th{text-align:right;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.mt td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.mt th:first-child,.mt td:first-child{text-align:left}
.mt tr:last-child td{border-bottom:0}
.remark{padding:8px 16px;border-top:1px dashed var(--line);display:grid;gap:8px}
.remark .inp{height:42px}
.linkbtn{background:none;border:0;color:var(--red);font-weight:700;padding:2px 0;text-align:left;font-size:14px}
.rchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip.sm{padding:6px 10px;font-size:13px;white-space:nowrap}
.onote{display:block;font-style:italic;color:var(--ink);opacity:.85;white-space:normal}
.undo{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:14px;font-weight:600}
.undo .ghost{padding:6px 14px;border-color:var(--red);color:var(--red);background:var(--surface)}

/* lists */
.list{display:grid}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .no{font-family:var(--display);font-weight:800;font-size:22px;font-style:italic}
.row .mid{min-width:0}
.row .mid div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid small{color:var(--muted);font-size:13px}
.row .r{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.row.voided .mid div,.row.voided .r{text-decoration:line-through;color:var(--muted)}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inp{height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:0 12px;width:100%;min-width:0;box-sizing:border-box}
.btn{height:48px;border:0;border-radius:12px;background:var(--red);color:var(--on-red);font-weight:700;padding:0 18px}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.quiet{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.del{background:var(--bad);color:var(--on-red)}
.btn:disabled{opacity:.35;cursor:default}
.del-list{background:var(--surface-2);border-radius:12px;padding:4px 12px}
.menu-row{display:grid;grid-template-columns:minmax(0,2fr) 90px minmax(0,1.2fr) auto auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.menu-row:last-child{border-bottom:0}
.tog{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap}
.tog input{width:20px;height:20px;accent-color:var(--red)}
.note{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.big-stock{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;font-variant-numeric:tabular-nums}

/* modal + pin + toast */
.modal{position:fixed;inset:0;background:rgba(10,6,5,.55);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--surface);border-radius:20px;width:min(480px,100%);max-height:88vh;overflow:auto;padding:20px;display:grid;gap:14px;box-sizing:border-box}
.sheet h2{margin:0;font-family:var(--display);font-style:italic;font-weight:800;font-size:28px;text-transform:uppercase}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sheet textarea{width:100%;min-height:200px;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.pin{position:fixed;inset:0;background:var(--red);color:var(--on-red);display:grid;place-items:center;z-index:30;padding:16px}
.pin-box{display:grid;gap:18px;justify-items:center;width:min(340px,100%)}
.pin-box .brand{font-size:56px;text-align:center}
.pin-roles{display:flex;gap:6px;background:var(--red-deep);border-radius:999px;padding:4px}
.pin-roles button{border:0;background:transparent;color:var(--on-red);font-weight:700;padding:10px 22px;border-radius:999px}
.pin-roles button.on{background:var(--on-red);color:var(--red)}
.dots{display:flex;gap:14px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--on-red)}
.dots i.f{background:var(--on-red)}
.keys{display:grid;grid-template-columns:repeat(3,80px);gap:12px}
.keys button{height:80px;border-radius:50%;border:0;background:var(--red-deep);color:var(--on-red);font-family:var(--display);font-weight:700;font-size:32px}
.keys button.t{background:transparent;font-size:16px;font-family:var(--body)}
.pin-hint{font-size:13px;opacity:.85}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion: reduce){.tile{transition:none}.shake{animation:none}}

/* motion: entrance animations use "backwards" fill so they never pin a transform after they finish */
.fly{position:fixed;width:18px;height:18px;border-radius:50%;z-index:50;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.stamp{position:absolute;inset:0;display:grid;place-items:center;background:var(--surface);pointer-events:none;opacity:0;z-index:2}
.stamp-in{display:grid;justify-items:center;gap:6px;text-align:center}
.stamp-in b{font-family:var(--display);font-style:italic;font-weight:800;font-size:26px;text-transform:uppercase}
.stamp-in small{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.tick{width:68px;height:68px;border-radius:50%;background:var(--good);display:grid;place-items:center}
.tick svg{width:36px;height:36px;stroke:var(--on-red);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:0}
.amt{transform-origin:right center}
.bcol i{transform-origin:bottom}
.hrow .tr i,.prog i{transform-origin:left}
@media (prefers-reduced-motion: no-preference){
  .enter{animation:fadeUp .28s ease-out backwards}
  .enter .tile{animation:fadeUp .38s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms)}
  .enter .stat{animation:fadeUp .4s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*60ms)}
  .enter .bcol i{animation:growY .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(120ms + var(--i,0)*22ms)}
  .enter .hrow .tr i{animation:growX .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(150ms + var(--i,0)*60ms)}
  .enter .prog i{animation:growX .9s cubic-bezier(.2,.8,.2,1) .2s backwards}
  .badge.pop{animation:pop .32s cubic-bezier(.3,1.6,.5,1)}
  .step b.pop{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
  .line.slide{animation:slideIn .28s cubic-bezier(.2,.8,.2,1) backwards}
  .amt.bump{animation:bump .34s cubic-bezier(.3,1.6,.5,1) .36s}
  .stamp{animation:stampBg 1.15s ease forwards}
  .stamp .stamp-in{animation:stampIn 1.15s cubic-bezier(.2,.9,.3,1.25) forwards}
  .stamp .tick svg{animation:draw .35s .15s ease-out backwards}
  .undo.slide{animation:slideDown .3s cubic-bezier(.2,.8,.2,1) .95s backwards}
  .modal.show{animation:fadeIn .18s ease-out}
  .modal.show .sheet{animation:sheetUp .3s cubic-bezier(.2,.9,.3,1.05)}
  .toast.in{animation:toastIn .28s cubic-bezier(.2,.9,.3,1.2)}
  .pin.show .pin-box{animation:fadeUp .3s ease-out backwards}
  .pin.out{animation:fadeOut .22s ease-in forwards}
  .dots i.pop{animation:pop .25s cubic-bezier(.3,1.6,.5,1)}
  .tabs button{transition:background-color .2s,color .2s}
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes pop{40%{transform:scale(1.35)}}
@keyframes bump{40%{transform:scale(1.07)}}
@keyframes slideIn{from{opacity:0;transform:translateX(18px)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}}
@keyframes sheetUp{from{opacity:0;transform:translateY(28px) scale(.98)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}}
@keyframes draw{from{stroke-dashoffset:40}}
@keyframes stampBg{0%{opacity:0}12%{opacity:.97}78%{opacity:.97}100%{opacity:0}}
@keyframes stampIn{0%{transform:scale(.6);opacity:0}18%{transform:scale(1.06);opacity:1}28%{transform:scale(1)}78%{transform:scale(1);opacity:1}100%{transform:scale(.96);opacity:0}}

/* theme switch */
.themebtn{width:38px;height:38px;flex:none;border-radius:50%;border:0;background:var(--red-deep);color:var(--on-red);display:grid;place-items:center;padding:0}
.themebtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* update banner */
.sample.upd{background:var(--ink);color:var(--bg);border-bottom:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sample.upd b{color:var(--bg)}
.sample.upd .ghost{border-color:var(--bg);color:var(--bg);padding:4px 12px}
/* close day */
.csteps{display:grid;gap:10px}
.cstep{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface-2);border-radius:14px;padding:12px}
.cnum{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}
.cnum svg{width:22px;height:22px;fill:none;stroke:var(--on-red);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.cstep.done .cnum{background:var(--good);box-shadow:none}
.ctext b{display:block;font-size:16px}
.ctext small{color:var(--muted);font-size:13px}
.cstep .btn{height:44px}
.pill.closed{background:var(--good);color:var(--on-red);margin-left:8px;vertical-align:middle;font-family:var(--body);font-style:normal}
/* activity log */
.pill.adm{background:var(--ink);color:var(--bg)}
.pill.stf{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.logrow .mid small{display:block;white-space:normal}
/* calendar heatmap */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calhead h3{margin:0}
.calhead .chip{padding:6px 12px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.cal-d{position:relative;aspect-ratio:1/1;border:0;border-radius:8px;background:var(--surface-2);overflow:hidden;padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;color:var(--ink);min-width:0}
.cal-d i{position:absolute;inset:0;background:var(--red)}
.cal-d span{position:relative;font-variant-numeric:tabular-nums;line-height:1.1}
.cal-d .dn{font-size:11px;font-weight:700}
.cal-d .dv{font-size:10px;font-weight:600}
.cal-d.hot{color:var(--on-red)}
.cal-d.fut{opacity:.35;cursor:default}
.cal-d.now{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-key{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.cal-key i{width:14px;height:14px;border-radius:4px;background:var(--red);display:inline-block}
.cal-key .z{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
/* flavour trends */
.trend-svg{width:100%;height:auto;display:block}
.trend-svg text{font-family:var(--body);font-size:10px;fill:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
@media (prefers-reduced-motion: no-preference){
  .enter .cal-d i{animation:fadeIn .5s ease-out backwards;animation-delay:calc(100ms + var(--i,0)*12ms)}
  .enter .trend-svg polyline{stroke-dasharray:1200;animation:drawLine 1.1s ease-out .2s backwards}
  .cstep.done .cnum{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
}
@keyframes drawLine{from{stroke-dashoffset:1200}}
/* dashboard runs each animation 0.2s longer than the other screens */
.enter.dash{animation-duration:.48s}
.enter.dash .stat{animation-duration:.6s}
.enter.dash .bcol i{animation-duration:.8s}
.enter.dash .hrow .tr i{animation-duration:.9s}
.enter.dash .prog i{animation-duration:1.1s}
.enter.dash .cal-d i{animation-duration:.7s}
.enter.dash .trend-svg polyline{animation-duration:1.3s}

@media (max-width:860px){
  .pos{display:flex;flex-direction:column;gap:12px}
  .tiles{flex:1;min-height:0;overflow:auto;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .ticket{flex:none;max-height:52%}
  .ticket.has-remark{max-height:66%}
  .ticket.has-remark .lines{min-height:58px}
  .lines{min-height:0}
  .lines .empty{padding:14px 8px}
  .two{grid-template-columns:1fr}
  .menu-row{grid-template-columns:minmax(0,1fr) 80px;}
}
@media (max-width:480px){
  main{padding-top:12px}
  .top{gap:8px 12px}
  .tabs{order:3;flex-basis:100%}
  .tile{min-height:100px;padding:12px;gap:8px;border-radius:14px}
  .sw{width:26px;height:26px}
  .tname{font-size:22px}
  .tprice{font-size:16px}
  .badge{min-width:34px;height:34px;border-radius:17px;font-size:20px;top:8px;right:8px}
  .ticket-head{padding:10px 14px 8px}
  .lines{padding:0 14px}
  .line{padding:6px 0}
  .step button{width:38px;height:38px}
  .sum{padding:10px 14px 12px;gap:8px}
  .amt{font-size:36px}
  .go{height:54px;font-size:22px}
  .stat b{font-size:26px;white-space:nowrap}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hrow{grid-template-columns:84px minmax(0,1fr) 80px}
  .keys{grid-template-columns:repeat(3,70px)}
  .keys button{height:70px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Kepok Kaw<small>Cashier</small></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="who"><button class="themebtn" id="themeBtn" data-act="theme" aria-label="Switch light or dark"></button><span class="role" id="roleChip">Admin</span><button class="lock" data-act="lock" id="lockBtn">Switch user</button></div>
  </header>
  <div class="checker" aria-hidden="true"></div>
  <div class="sample upd" id="updateBar" hidden><span><b>New version ready.</b> Reload to start using it.</span><button class="ghost" data-act="reload">Reload</button></div>
  <div class="sample" id="sampleBar" hidden><b>Sample data.</b> These are made-up sales from the last 14 days, so you can try the dashboard. Clear them in Settings before you use it for real.</div>
  <div class="sample" id="backupBar" hidden></div>
  <main id="main"></main>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="pin" id="pin" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="xlsx.js"></script>
<script src="pdf.js"></script>
<script>
(function(){
const LS='kepokkaw-pos-v1', LS_ROLE='kepokkaw-pos-role', LS_THEME='kepokkaw-pos-theme';
const EXP_CATS=['Lekor stock','Frozen stock','Cooking oil','Gas','Packaging','Sauces & toppings','Wages','Rent','Other'];
const VIEWS=[['cashier','Cashier'],['orders','Orders'],['dashboard','Dashboard'],['expenses','Expenses'],['stock','Stock'],['settings','Settings']];
const STAFF_VIEWS=['cashier','orders','stock'];
const UNDO_MS=120000;
let lastOrderId=null, undoTimer=null;
const REMARKS=['Takeaway','Extra sauce','No sauce','Sauce separate','Less spicy','Extra spicy'];
let cartNote='', remarkOpen=false;
const noteParts=n=>n.split(',').map(x=>x.trim()).filter(Boolean);
let fx={}, renderedView=null, prevTotal=0;
const MOTION=!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let S, role='admin', view='cashier', cart={}, dashP='7d', ordDate=null, expMonth=null, pinRole='staff', pinBuf='', pending=null;

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
// The stall trades 6:30pm to midnight, so a sale before 4am belongs to the night before.
const DAY_ENDS=4;
const bdate=ts=>{const d=new Date(ts);d.setHours(d.getHours()-DAY_ENDS);return dkey(d)};
const today=()=>bdate(Date.now());
const bh=h=>(h-DAY_ENDS+24)%24;
const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return dkey(d)};
const tsOf=(k,h,m,s)=>{const d=parse(k);d.setHours(h,m||0,s||0,0);return d.getTime()};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rm=n=>'RM '+n.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const rm0=n=>'RM '+(Number.isInteger(n)?n:n.toFixed(2));
const tm=ts=>new Date(ts).toLocaleTimeString('en-MY',{hour:'numeric',minute:'2-digit'});
const dlabel=k=>parse(k).toLocaleDateString('en-MY',{weekday:'short',day:'numeric',month:'short'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const item=id=>S.items.find(i=>i.id===id);
function days(a,b){const o=[];for(let k=a;k<=b;k=addDays(k,1))o.push(k);return o}

/* ---------- storage ---------- */
const DBN='kepokkaw-pos',ST='kv';let dbp=null,saving=Promise.resolve(),saveFailed=false;
function db(){return dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
function idbGet(k){return db().then(d=>new Promise((res,rej)=>{const q=d.transaction(ST).objectStore(ST).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}))}
function idbPut(k,v){return db().then(d=>new Promise((res,rej)=>{const tx=d.transaction(ST,'readwrite');tx.objectStore(ST).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)}))}
function save(){
  const json=JSON.stringify(S);
  saving=saving.then(()=>idbPut('state',json)).then(()=>{if(saveFailed){saveFailed=false;toast('Saving works again')}},()=>{saveFailed=true;toast('Could not save on this device. Back up now in Settings.')});
  try{localStorage.setItem(LS,json)}catch(e){try{localStorage.removeItem(LS)}catch(e2){}}
}
async function load(){
  let raw=null;
  try{raw=await idbGet('state')}catch(e){}
  if(!raw){try{raw=localStorage.getItem(LS)}catch(e){}}
  if(raw){try{S=JSON.parse(raw);return}catch(e){}}
  S=fresh();save();
}
function needsBackup(){const last=S.lastBackup||0;return !S.sample&&S.orders.some(o=>o.ts>last)&&Date.now()-last>20*3600e3}
function baseItems(){return[
  {id:'ori',name:'Original',price:9,cat:'flavour',active:true,color:'#D9A441'},
  {id:'hot',name:'Hot & Spicy',price:10,cat:'flavour',active:true,color:'#D2381F'},
  {id:'egg',name:'Salted Egg',price:10,cat:'flavour',active:true,color:'#EBC12F'},
  {id:'bbq',name:'BBQ',price:10,cat:'flavour',active:true,color:'#7A3B1E'},
  {id:'chz',name:'Cheese',price:11,cat:'flavour',active:true,color:'#F59E0B'},
  {id:'frz',name:'Frozen Pack',price:35,cat:'frozen',active:true,color:'#3B6E8F',stock:true,qty:0}
]}

/* sample data: 14 days, seeded so it is the same every time */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function fresh(){return{v:1,sample:false,items:baseItems(),orders:[],expenses:[],moves:[],pins:{admin:'1234',staff:'0000'},lowAt:5}}
function seed(){
  const r=mulberry(7), pick=(arr,w)=>{let x=r()*w.reduce((a,b)=>a+b,0);for(let i=0;i<arr.length;i++){x-=w[i];if(x<0)return arr[i]}return arr[arr.length-1]};
  const s={v:1,sample:true,items:baseItems(),orders:[],expenses:[],moves:[],pins:{admin:'1234',staff:'0000'},lowAt:5};
  const frz=s.items.find(i=>i.id==='frz'), now=Date.now(), start=addDays(today(),-13);
  const flav=['ori','hot','egg','bbq','chz'], fw=[30,22,18,12,18];
  const hrs=[18,19,20,21,22,23,24], hw=[2,6,9,10,9,6,2];
  const exp=(date,cat,amount,note)=>s.expenses.push({id:uid()+s.expenses.length,date,cat,amount,note,ts:tsOf(date,9)});
  frz.qty=24; s.moves.push({ts:tsOf(start,9),itemId:'frz',delta:24,reason:'Opening stock'}); exp(start,'Frozen stock',528,'24 packs');
  s.target=800;
  days(start,today()).forEach((day,i)=>{
    const dow=parse(day).getDay();if(dow===1)return;
    if(i>0&&frz.qty<8){frz.qty+=20;s.moves.push({ts:tsOf(day,9),itemId:'frz',delta:20,reason:'Received stock'});exp(day,'Frozen stock',440,'20 packs')}
    if(i%2===0)exp(day,'Lekor stock',260+Math.round(r()*60),'Keropok lekor');
    if(i%3===0)exp(day,'Cooking oil',42,'2 bottles');
    if(i%6===0)exp(day,'Gas',28,'Gas refill');
    if(i%7===0)exp(day,'Packaging',65,'Cups & paper');
    if(i%4===1)exp(day,'Sauces & toppings',48+Math.round(r()*20),'Cheese sauce, seasoning');
    exp(day,'Wages',70,'Staff');
    const wk=dow===0||dow===6, n=Math.round(26+r()*22+(wk?14:0)), list=[];
    for(let k=0;k<n;k++){
      const ts=tsOf(day,pick(hrs,hw),Math.floor(r()*60),Math.floor(r()*60));
      const nl=pick([1,2,3],[60,30,10]), q={};
      for(let j=0;j<nl;j++){const f=pick(flav,fw);q[f]=(q[f]||0)+(r()<.8?1:2)}
      if(r()<.07)q.frz=1;
      if(ts<=now)list.push({ts,q});
    }
    list.sort((a,b)=>a.ts-b.ts);
    let no=0;
    list.forEach(o=>{
      if(o.q.frz&&frz.qty<1)delete o.q.frz;
      const lines=Object.entries(o.q).map(([id,qty])=>{const it=s.items.find(x=>x.id===id);return{itemId:id,name:it.name,price:it.price,qty}});
      no++;
      const ord={id:uid()+no+day,no,ts:o.ts,date:day,lines,total:lines.reduce((a,l)=>a+l.price*l.qty,0),by:r()<.7?'staff':'admin',voided:null};
      if(r()<.12)ord.note=pick(REMARKS,[5,3,3,2,2,1]);
      if(o.q.frz){frz.qty-=1;s.moves.push({ts:o.ts,itemId:'frz',delta:-1,reason:`Sold · order #${no}`})}
      s.orders.push(ord);
    });
  });
  const y=addDays(today(),-1), v=s.orders.find(o=>o.date===y&&o.no>=5&&!o.lines.some(l=>l.itemId==='frz'));
  if(v)v.voided={ts:v.ts+120000,reason:'Wrong flavour keyed in',by:'admin'};
  return s;
}

/* ---------- render ---------- */
function allowed(v){return role==='admin'||STAFF_VIEWS.includes(v)}
function render(){
  if(!allowed(view))view='cashier';
  $('tabs').innerHTML=VIEWS.filter(([v])=>allowed(v)).map(([v,l])=>`<button class="${v===view?'on':''}" data-act="view" data-id="${v}">${l}</button>`).join('');
  $('roleChip').textContent=role==='admin'?'Admin':'Staff';
  $('sampleBar').hidden=!S.sample;
  const nb=role==='admin'&&needsBackup();$('backupBar').hidden=!nb;
  if(nb)$('backupBar').innerHTML=`<b>${S.lastBackup?'Last backup '+dlabel(dkey(new Date(S.lastBackup)))+'.':'No backup yet.'}</b> Save a copy of your sales in case this device is lost. <button class="ghost" data-act="backup" style="padding:4px 10px;margin-left:6px">Back up now</button>`;
  const m=$('main'), entering=view!==renderedView||fx.enter;renderedView=view;
  ({cashier:vCashier,orders:vOrders,dashboard:vDash,expenses:vExpenses,stock:vStock,settings:vSettings})[view](m);
  if(entering&&m.firstElementChild){m.firstElementChild.classList.add('enter');if(MOTION)countUp(m)}
  fx={};
}
function countUp(root){
  root.querySelectorAll('[data-n]').forEach(el=>{
    const n=+el.dataset.n, f=el.dataset.fmt, fmt=v=>f==='int'?String(Math.round(v)):(v<0?'−':'')+rm(Math.abs(v)), t0=performance.now();
    const step=t=>{const p=Math.min(1,(t-t0)/900), e=1-Math.pow(1-p,3);el.textContent=fmt(n*e);if(p<1)requestAnimationFrame(step)};
    el.textContent=fmt(0);requestAnimationFrame(step);
  });
}
function fly(r,color){
  const to=document.querySelector('.ticket .amt');if(!MOTION||!to||!r||!document.body.animate)return;
  const t=to.getBoundingClientRect(), d=document.createElement('div');
  const x0=r.left+r.width/2-9, y0=r.top+r.height/2-9, dx=t.left+t.width/2-9-x0, dy=t.top+t.height/2-9-y0;
  d.className='fly';d.style.background=color;d.style.left=x0+'px';d.style.top=y0+'px';document.body.appendChild(d);
  d.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx*.5}px,${dy*.5-90}px) scale(1.2)`,offset:.45},{transform:`translate(${dx}px,${dy}px) scale(.35)`,opacity:.25}],{duration:540,easing:'cubic-bezier(.45,0,.25,1)'}).onfinish=()=>d.remove();
}

function vCashier(m){
  const items=S.items.filter(i=>i.active), t=today();
  const nToday=S.orders.filter(o=>o.date===t&&!o.voided).length;
  const tiles=items.map((it,ti)=>{
    const q=cart[it.id]||0, out=it.stock&&it.qty<=0, low=it.stock&&it.qty<=S.lowAt;
    return `<button class="tile ${q?'in':''} ${out?'out':''}" data-act="add" data-id="${it.id}" style="--sw:${esc(it.color||'#999')};--i:${ti}" aria-label="Add ${esc(it.name)}">
      ${q?`<span class="badge ${fx.pop===it.id?'pop':''}">${q}</span>`:''}
      <span class="sw"></span>
      <span class="tname">${esc(it.name)}</span>
      <span class="tmeta"><span class="tprice">${rm0(it.price)}</span>${it.stock?`<span class="tstock ${low?'low':''}">${it.qty} left</span>`:''}</span>
    </button>`}).join('');
  const lines=Object.entries(cart).filter(([,q])=>q>0);
  const total=lines.reduce((s,[id,q])=>s+item(id).price*q,0);
  const count=lines.reduce((s,[,q])=>s+q,0);
  const lo=lastOrderId&&S.orders.find(o=>o.id===lastOrderId), showUndo=lo&&!lo.voided&&Date.now()-lo.ts<=UNDO_MS;
  const bump=total!==prevTotal&&!fx.saved;prevTotal=total;
  const stamp=fx.saved&&MOTION?`<div class="stamp"><div class="stamp-in"><span class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><b>Order #${fx.saved.no} saved</b><small>${rm(fx.saved.total)}</small></div></div>`:'';
  m.innerHTML=`<div class="pos">
    <div class="tiles">${tiles}</div>
    <aside class="ticket ${lines.length&&(remarkOpen||cartNote)?'has-remark':''}">${stamp}
      <div class="ticket-head"><h2>Order #${nextNo(t)}</h2><span>${nToday} orders today</span></div>
      ${showUndo?`<div class="undo ${fx.saved?'slide':''}"><span>Order #${lo.no} saved · ${rm(lo.total)}</span><button class="ghost" data-act="voidask" data-id="${lo.id}">Undo</button></div>`:''}
      <div class="lines">${lines.length?lines.map(([id,q])=>{const it=item(id);return`<div class="line ${fx.pop===id&&fx.newLine?'slide':''}">
          <div><div class="lname">${esc(it.name)}</div><div class="lsub">${q} × ${rm0(it.price)} = ${rm(it.price*q)}</div></div>
          <div class="step"><button data-act="dec" data-id="${id}" aria-label="One less">−</button><b class="${fx.pop===id&&!fx.newLine?'pop':''}">${q}</b><button data-act="add" data-id="${id}" aria-label="One more">+</button></div>
        </div>`}).join(''):'<div class="empty">Tap a flavour to start the order.</div>'}</div>
      ${lines.length?`<div class="remark">${remarkOpen||cartNote?`<input class="inp" id="cartNote" placeholder="Remark, e.g. no sauce" value="${esc(cartNote)}" maxlength="120" autocomplete="off" aria-label="Remark for this order">
        <div class="rchips">${REMARKS.map(r=>`<button class="chip sm ${noteParts(cartNote).includes(r)?'on':''}" data-act="rchip" data-id="${r}">${r}</button>`).join('')}</div>`:'<button class="linkbtn" data-act="remark">+ Add remark</button>'}</div>`:''}
      <div class="sum">
        <div class="sum-row"><span>${count} item${count===1?'':'s'}</span>${lines.length?'<button class="ghost" data-act="clear">Clear</button>':''}</div>
        <div class="sum-row"><span>Total</span><div class="amt ${bump?'bump':''}">${rm(total)}</div></div>
        <button class="go" data-act="complete" ${lines.length?'':'disabled'}>Complete order</button>
      </div>
    </aside>
  </div>`;
}

function vOrders(m){
  const t=today();
  if(role!=='admin'||!ordDate)ordDate=ordDate&&role==='admin'?ordDate:t;

const PERIODS=[['today','Today'],['yesterday','Yesterday'],['7d','7 days'],['30d','30 days'],['month','This month'],['lastmonth','Last month']];
const PREV_LABEL={today:'yesterday',yesterday:'day before','7d':'prev 7 days','30d':'prev 30 days',month:'last month',lastmonth:'month before'};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], DOW_LONG=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const hl=h=>h===0||h===24?'12am':h<12?h+'am':h===12?'12pm':(h-12)+'pm';
const money0=n=>'RM '+Math.round(n).toLocaleString('en-MY');
const dlong=k=>parse(k).toLocaleDateString('en-MY',{day:'numeric',month:'short',year:'numeric'});
function range(p){
  const t=today(),ms=t.slice(0,8)+'01';
  if(p==='today')return[t,t];
  if(p==='yesterday'){const y=addDays(t,-1);return[y,y]}
  if(p==='7d')return[addDays(t,-6),t];
  if(p==='30d')return[addDays(t,-29),t];
  if(p==='month')return[ms,t];
  const e=addDays(ms,-1);return[e.slice(0,8)+'01',e];
}
function prevRange(p,a,b){
  if(p==='month'){const pe=addDays(a,-1),ps=pe.slice(0,8)+'01',end=addDays(ps,days(a,b).length-1);return[ps,end<pe?end:pe]}
  if(p==='lastmonth'){const pe=addDays(a,-1);return[pe.slice(0,8)+'01',pe]}
  const n=days(a,b).length;return[addDays(a,-n),addDays(a,-1)];
}
function totals(a,b){
  const ords=S.orders.filter(o=>!o.voided&&o.date>=a&&o.date<=b), exps=S.expenses.filter(e=>e.date>=a&&e.date<=b);
  const sales=ords.reduce((s,o)=>s+o.total,0), cost=exps.reduce((s,e)=>s+e.amount,0);
  return{ords,exps,sales,cost,profit:sales-cost};
}
function trend(cur,prev,goodUp){
  if(!prev)return'';
  const p=(cur-prev)/Math.abs(prev)*100, up=cur>=prev, good=goodUp?up:!up;
  return `<small class="trend ${good?'up':'down'}">${up?'▲':'▼'} ${Math.abs(Math.round(p))}% vs ${PREV_LABEL[dashP]}</small>`;
}
function itemTotals(ords){
  const per={};ords.forEach(o=>o.lines.forEach(l=>{const p=per[l.itemId]||(per[l.itemId]={id:l.itemId,name:l.name,qty:0,rev:0});p.qty+=l.qty;p.rev+=l.price*l.qty}));
  return Object.values(per).sort((x,y)=>y.rev-x.rev);
}
function vDash(m){
  const [a,b]=range(dashP), ds=days(a,b), T=totals(a,b), [pa,pb]=prevRange(dashP,a,b), P=totals(pa,pb);
  const {ords,exps,sales,cost,profit}=T, target=S.target||0;
  const prods=itemTotals(ords), maxRev=Math.max(1,...prods.map(p=>p.rev));

  // busy hours in trading order: 6pm to midnight by default, stretched to any hour that has sales
  const hs=ords.map(o=>bh(new Date(o.ts).getHours())), b0=Math.min(bh(18),...hs), b1=Math.max(bh(23),...hs), hours=[];
  for(let x=b0;x<=b1;x++)hours.push((x+DAY_ENDS)%24);
  const hc=hours.map(h=>ords.filter(o=>new Date(o.ts).getHours()===h).length), maxH=Math.max(1,...hc), hstep=hours.length>12?2:1;

    const sd=ds.map(d=>ords.filter(o=>o.date===d).reduce((s,o)=>s+o.total,0)), ed=ds.map(d=>exps.filter(e=>e.date===d).reduce((s,e)=>s+e.amount,0));
    const mx=Math.max(1,...sd,...ed,target*1.08), step=ds.length>14?5:1, hit=target?sd.filter(v=>v>=target).length:0, open=sd.filter(v=>v>0).length;

      <div class="chart"><span class="max">${money0(mx)}</span>

      <div class="xl">${ds.map((d,i)=>`<span>${(ds.length-1-i)%step===0?parse(d).getDate():''}</span>`).join('')}</div></div></div>`;
  }

  // daily target progress for a single day
  let goal='';
  if(target&&a===b){
    const pct=sales/target*100;
    goal=`<div class="panel"><h3>Daily target</h3><div class="prog"><i style="width:${Math.min(100,pct)}%"></i></div>
      <p class="note" style="margin-top:8px"><b>${rm(sales)}</b> of ${rm(target)} · ${Math.round(pct)}% · ${pct>=100?'Target reached':rm(target-sales)+' to go'}</p></div>`;
  }

  // best day of the week: average sales per open day
  const [wa,wb]=ds.length>=14?[a,b]:[addDays(today(),-55),today()], byDate={};
  S.orders.forEach(o=>{if(!o.voided&&o.date>=wa&&o.date<=wb)byDate[o.date]=(byDate[o.date]||0)+o.total});
  const wsum=[0,0,0,0,0,0,0], wcnt=[0,0,0,0,0,0,0];
  Object.entries(byDate).forEach(([d,v])=>{const w=parse(d).getDay();wsum[w]+=v;wcnt[w]++});
  const worder=[1,2,3,4,5,6,0], wavg=worder.map(w=>wcnt[w]?wsum[w]/wcnt[w]:0), wmax=Math.max(1,...wavg), wbest=wavg.indexOf(Math.max(...wavg));
  const week=`<div class="panel"><h3>Best day of the week · avg sales, ${ds.length>=14?'this period':'last 8 weeks'}</h3>
    ${Object.keys(byDate).length?`<div class="chart"><span class="max">${money0(wmax)}</span>
      <div class="bars" style="height:150px">${wavg.map((v,i)=>`<div class="bcol" style="--i:${i}" title="${DOW_LONG[worder[i]]}: avg ${rm(v)}"><i class="s" style="height:${v/wmax*100}%;${i===wbest?'':'opacity:.45'}"></i></div>`).join('')}</div>
      <div class="xl">${worder.map(w=>`<span>${DOW[w]}</span>`).join('')}</div></div>
      <p class="note" style="margin-top:8px">Best: <b>${DOW_LONG[worder[wbest]]}</b>, about ${money0(wavg[wbest])} a night.</p>`:'<div class="empty">Not enough sales yet.</div>'}
  </div>`;

  let mrows=months.map(d=>{const k=dkey(d).slice(0,7),ms=k+'-01',me=k+'-31',t=totals(ms,me);return{d,k,...t}});

  </table></div></div>`;

  const best=prods[0];
  m.innerHTML=`<div class="wrap dash">
    <div class="bar"><h1 class="h1">Dashboard</h1><div class="chips">
      <button class="btn quiet" data-act="sumshare">Share summary</button>
      <button class="btn quiet" data-act="pdf">PDF</button>
      <button class="btn dark" data-act="xlsx">Excel</button></div></div>
    <div class="chips">${PERIODS.map(([k,l])=>`<button class="chip ${k===dashP?'on':''}" data-act="dash" data-id="${k}">${l}</button>`).join('')}</div>
    <div class="stats">
      <div class="stat" style="--i:0"><span>Sales</span><b data-n="${sales}" data-fmt="rm">${rm(sales)}</b><small>${a===b?dlabel(a):dlabel(a)+' – '+dlabel(b)}</small>${trend(sales,P.sales,true)}</div>
      <div class="stat" style="--i:1"><span>Expenses</span><b data-n="${cost}" data-fmt="rm">${rm(cost)}</b><small>${exps.length} entries</small>${trend(cost,P.cost,false)}</div>
      <div class="stat" style="--i:2"><span>Profit</span><b class="${profit>=0?'pos-v':'neg-v'}" data-n="${profit}" data-fmt="rm">${profit<0?'−':''}${rm(Math.abs(profit))}</b><small>${sales?Math.round(profit/sales*100)+'% of sales':'—'}</small>${trend(profit,P.profit,true)}</div>
      <div class="stat" style="--i:3"><span>Orders</span><b data-n="${ords.length}" data-fmt="int">${ords.length}</b><small>avg ${ords.length?rm(sales/ords.length):'—'}</small>${trend(ords.length,P.ords.length,true)}</div>
    </div>
    ${goal}
    ${daily}
    <div class="two">
      <div class="panel"><h3>By flavour${best?` · best seller: ${esc(best.name)}`:''}</h3>
        ${prods.length?prods.map((p,pi)=>{const it=item(p.id);return`<div class="hrow" style="--i:${pi}"><span class="nm">${esc(p.name)}</span><span class="tr"><i style="width:${p.rev/maxRev*100}%;background:${esc(it?it.color:'var(--red)')}"></i></span><span class="v">${rm0(p.rev)}<small>${p.qty} sold</small></span></div>`}).join(''):'<div class="empty">No sales in this period.</div>'}

  </div>`;

const darkMQ=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function isDark(){return themePref==='dark'||(themePref==='auto'&&!!(darkMQ&&darkMQ.matches))}
function applyTheme(){
  const r=document.documentElement;
  if(themePref==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',themePref);
  const b=$('themeBtn');if(b){b.innerHTML=isDark()?SUN:MOON;b.setAttribute('aria-label',isDark()?'Switch to light mode':'Switch to dark mode')}

function setTheme(p){themePref=p;try{localStorage.setItem(LS_THEME,p)}catch(e){}applyTheme()}

/* ---------- share text: day report, period summary ---------- */
function textSheet(title,text){
  openModal(`<h2>${esc(title)}</h2><p class="note">Check it, then tap Send and choose WhatsApp.</p>
    <textarea id="repOut" readonly style="font-family:var(--body);font-size:14px;min-height:300px">${esc(text)}</textarea>
    <div class="acts"><button class="btn quiet" data-act="close">Close</button><button class="btn quiet" data-act="copyrep">Copy</button><button class="btn" data-act="sendrep">Send</button></div>`);
}
function pctTxt(cur,prev){if(!prev)return'';const p=Math.round((cur-prev)/Math.abs(prev)*100);return ` (${p>=0?'+':''}${p}% vs ${PREV_LABEL[dashP]})`}
function periodSummary(a,b){
  const T=totals(a,b),[pa,pb]=prevRange(dashP,a,b),P=totals(pa,pb),prods=itemTotals(T.ords),n=days(a,b).length,items=prods.reduce((s,p)=>s+p.qty,0);
  const L=['*KEPOKKAW* · Sales summary',a===b?parse(a).toLocaleDateString('en-MY',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):`${dlong(a)} – ${dlong(b)} (${n} days)`,''];
  L.push(`*Sales: ${rm(T.sales)}*${pctTxt(T.sales,P.sales)}`,`Expenses: ${rm(T.cost)}${pctTxt(T.cost,P.cost)}`);
  L.push(`*Profit: ${T.profit<0?'-':''}${rm(Math.abs(T.profit))}*${T.sales?` (${Math.round(T.profit/T.sales*100)}% of sales)`:''}`);
  L.push(`Orders: ${T.ords.length}${T.ords.length?` · avg ${rm(T.sales/T.ords.length)}`:''}`,`Items sold: ${items}`);
  if(prods.length){L.push('','*By flavour*');prods.forEach(p=>L.push(`• ${p.name} ×${p.qty} = ${rm(p.rev)}`))}
  const extra=[];
  if(n>1){
    const by={};T.ords.forEach(o=>by[o.date]=(by[o.date]||0)+o.total);
    const bd=Object.entries(by).sort((x,y)=>y[1]-x[1])[0];if(bd)extra.push(`Best day: ${dlabel(bd[0])} (${rm(bd[1])})`);
    if(S.target&&bd){const vals=Object.values(by);extra.push(`Daily target ${money0(S.target)} hit on ${vals.filter(v=>v>=S.target).length} of ${vals.length} open days`)}
  }
  if(T.ords.length){const c={};T.ords.forEach(o=>{const h=new Date(o.ts).getHours();c[h]=(c[h]||0)+1});const [h]=Object.entries(c).sort((x,y)=>y[1]-x[1])[0];extra.push(`Busiest hour: ${hl(+h)}–${hl(+h+1)}`)}
  if(extra.length)L.push('',...extra);
  L.push('',`Sent by ${role==='admin'?'Admin':'Staff'} at ${tm(Date.now())}`);
  return L.join('\n');
}

/* ---------- close day: report + backup ---------- */
let closing=null;
const TICK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function closeSheet(date){closing={date,rep:false,bak:false};drawClose()}
function drawClose(){
  const {date,rep,bak}=closing, live=S.orders.filter(o=>o.date===date&&!o.voided), sales=live.reduce((s,o)=>s+o.total,0), done=S.closed&&S.closed[date];
  openModal(`<h2>Close day</h2>
    <p class="note">${parse(date).toLocaleDateString('en-MY',{weekday:'long',day:'numeric',month:'long'})} · ${live.length} orders · ${rm(sales)}${done?` · closed at ${tm(done.ts)}`:''}</p>
    <div class="csteps">
      <div class="cstep ${rep?'done':''}"><span class="cnum">${rep?TICK:'1'}</span><div class="ctext"><b>Send day report</b><small>${rep?'Sent':'Choose WhatsApp to send it to the owner'}</small></div><button class="btn ${rep?'quiet':''}" data-act="closerep">${rep?'Again':'Send'}</button></div>
      <div class="cstep ${bak?'done':''}"><span class="cnum">${bak?TICK:'2'}</span><div class="ctext"><b>Save backup</b><small>${bak?'Saved':'Keep the file in WhatsApp or Google Drive'}</small></div><button class="btn ${bak?'quiet':''}" data-act="closebak">${bak?'Again':'Save'}</button></div>
    </div>
    <div class="acts"><button class="btn ${rep&&bak?'':'quiet'}" data-act="close">${rep&&bak?'Done':'Later'}</button></div>`);
}
function closeStep(k){
  if(!closing)return;closing[k]=true;
  const d=closing.date;
  if(closing.rep&&closing.bak){
    S.closed=S.closed||{};
    if(!S.closed[d]){const live=S.orders.filter(o=>o.date===d&&!o.voided);S.closed[d]={ts:Date.now(),by:role};logA('Closed day',`${dlabel(d)} · ${live.length} orders · ${rm(live.reduce((s,o)=>s+o.total,0))}`);save();render()}
  }
  if(!$('modal').hidden)drawClose();
}

/* ---------- calendar heatmap ---------- */
let calMonth=null;
const shortRM=v=>v>=1000?(v/1000).toFixed(1).replace(/\.0$/,'')+'k':String(Math.round(v));
function calendarPanel(b){
  const ym=calMonth||b.slice(0,7), first=ym+'-01', d0=parse(first), dim=new Date(d0.getFullYear(),d0.getMonth()+1,0).getDate(), off=(d0.getDay()+6)%7, t=today();
  const by={};S.orders.forEach(o=>{if(!o.voided&&o.date.slice(0,7)===ym)by[o.date]=(by[o.date]||0)+o.total});
  const vals=Object.values(by), mx=Math.max(1,...vals), tot=vals.reduce((s,v)=>s+v,0), bestE=Object.entries(by).sort((x,y)=>y[1]-x[1])[0];
  let cells='';for(let i=0;i<off;i++)cells+='<span></span>';

    <div class="cal-key">Less <i class="z"></i><i style="opacity:.25"></i><i style="opacity:.5"></i><i style="opacity:.75"></i><i></i> More<span style="margin-left:auto">${vals.length?`${money0(tot)} this month · best day ${parse(bestE[0]).toLocaleDateString('en-MY',{day:'numeric',month:'short'})} (${money0(bestE[1])})`:'No sales this month'}</span></div>
    <p class="note" style="margin-top:6px">Tap a day to see its orders.</p>

/* ---------- flavour trends: last 8 weeks ---------- */
function trendsPanel(){
  const t=today(), weeks=[];for(let w=7;w>=0;w--){const e=addDays(t,-7*w);weeks.push([addDays(e,-6),e])}
  const ser={};
  S.orders.forEach(o=>{if(o.voided||o.date<weeks[0][0])return;const wi=weeks.findIndex(([s,e])=>o.date>=s&&o.date<=e);if(wi<0)return;
    o.lines.forEach(l=>{(ser[l.itemId]=ser[l.itemId]||{name:l.name,q:Array(8).fill(0)}).q[wi]+=l.qty})});
  const menu=S.items.map(i=>i.id), ids=Object.keys(ser).sort((x,y)=>(menu.indexOf(x)+1||99)-(menu.indexOf(y)+1||99));
  if(!ids.length)return '<div class="panel"><h3>Flavour trends · last 8 weeks</h3><div class="empty">Not enough sales yet.</div></div>';
  // start the chart at the first week with any sales, so a new stall does not show weeks of fake zeros
  let f0=0;while(f0<6&&ids.every(id=>!ser[id].q[f0]))f0++;
  const shown=weeks.slice(f0), nW=shown.length;
  const Wd=360,Hd=180,L=30,R=12,T=12,B=24, mx=Math.max(1,...ids.flatMap(id=>ser[id].q)), x=i=>L+i*(Wd-L-R)/(nW-1), y=v=>T+(Hd-T-B)*(1-v/mx);
  const grid=[0,.5,1].map(f=>{const v=Math.round(mx*f),yy=y(v);return `<line x1="${L}" x2="${Wd-R}" y1="${yy}" y2="${yy}" style="stroke:var(--line)"/><text x="${L-6}" y="${yy+3}" text-anchor="end">${v}</text>`}).join('');
  const xl=shown.map(([s],i)=>nW<=4||(nW-1-i)%2===0?`<text x="${x(i)}" y="${Hd-6}" text-anchor="middle">${parse(s).getDate()}/${parse(s).getMonth()+1}</text>`:'').join('');
  const lines=ids.map(id=>{const it=item(id),c=esc(it?it.color:'#999'),q=ser[id].q.slice(f0);
    return `<polyline points="${q.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(nW-1)}" cy="${y(q[nW-1])}" r="3.5" fill="${c}"/>`}).join('');
  const rows=ids.map(id=>{const it=item(id),q=ser[id].q,last=q.slice(4).reduce((s,v)=>s+v,0),prev=q.slice(0,4).reduce((s,v)=>s+v,0),p=prev?Math.round((last-prev)/prev*100):null;
    return `<tr><td><span class="dot" style="background:${esc(it?it.color:'#999')}"></span>${esc(ser[id].name)}</td><td>${last}</td><td>${prev}</td><td class="${p===null?'':p>=0?'pos-v':'neg-v'}">${p===null?'new':(p>=0?'▲ ':'▼ ')+Math.abs(p)+'%'}</td></tr>`}).join('');
  return `<div class="panel"><h3>Flavour trends · items sold per week</h3>
    <svg class="trend-svg" viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Items sold per week for each flavour over the last 8 weeks">${grid}${xl}${lines}</svg>
    <div class="tablewrap" style="margin-top:8px"><table class="mt"><thead><tr><th>Flavour</th><th>Last 4 wks</th><th>Prev 4 wks</th><th>Change</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

/* ---------- actions ---------- */
function addToCart(id,src){
  const it=item(id),q=(cart[id]||0)+1;
  if(it.stock&&q>it.qty){toast(it.qty?`Only ${it.qty} ${it.name} left`:`${it.name} is out of stock`);return}
  const from=src&&src.classList.contains('tile')?src.querySelector('.sw').getBoundingClientRect():null;
  fx.pop=id;fx.newLine=!cart[id];cart[id]=q;render();
  if(from)fly(from,it.color||'#999');
}
function complete(){
  const lines=Object.entries(cart).filter(([,q])=>q>0).map(([id,qty])=>{const it=item(id);return{itemId:id,name:it.name,price:it.price,qty}});
  if(!lines.length)return;
  for(const l of lines){const it=item(l.itemId);if(it.stock&&it.qty<l.qty){toast(`Only ${it.qty} ${it.name} left`);return}}
  const ts=Date.now(),date=bdate(ts),no=nextNo(date),total=lines.reduce((s,l)=>s+l.price*l.qty,0);
  const oid=uid();
  const note=cartNote.trim();
  S.orders.push(Object.assign({id:oid,no,ts,date,lines,total,by:role,voided:null},note?{note}:{}));
  lines.forEach(l=>{const it=item(l.itemId);if(it.stock){it.qty-=l.qty;S.moves.push({ts,itemId:it.id,delta:-l.qty,reason:`Sold · order #${no}`})}});
  cart={};cartNote='';remarkOpen=false;lastOrderId=oid;clearTimeout(undoTimer);

function saveFile(name,text,type){
  const blob=new Blob([text],{type});let file=null;
  try{file=new File([blob],name,{type})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]}))
    return navigator.share({files:[file]}).then(()=>true,e=>{if(e&&e.name==='AbortError')return false;return download()});
  return Promise.resolve(download());
  function download(){const u=URL.createObjectURL(blob),el=document.createElement('a');el.href=u;el.download=name;document.body.appendChild(el);el.click();setTimeout(()=>{URL.revokeObjectURL(u);el.remove()},3000);return true}
}

  S.moves.filter(x=>{const d=bdate(x.ts);return d>=a&&d<=b}).sort((x,y)=>x.ts-y.ts).forEach(x=>{const it=item(x.itemId);stock.push([D(bdate(x.ts)),{v:x.ts,t:'time'},it?it.name:x.itemId,x.delta,x.reason])});

  saveFile(`kepokkaw-${a===b?a:a+'-to-'+b}.xlsx`,bytes,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');

function dayReport(date){
  const all=S.orders.filter(o=>o.date===date), live=all.filter(o=>!o.voided), sales=live.reduce((s,o)=>s+o.total,0);
  const menu=S.items.map(i=>i.id), prods=itemTotals(live).sort((x,y)=>(menu.indexOf(x.id)+1||99)-(menu.indexOf(y.id)+1||99));
  const L=[`*KEPOKKAW* · ${parse(date).toLocaleDateString('en-MY',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}`,''];
  L.push(`Orders: ${live.length}${all.length-live.length?` (${all.length-live.length} voided)`:''}`,`*Sales: ${rm(sales)}*`);
  if(prods.length){L.push('','*Sold*');prods.forEach(p=>L.push(`• ${p.name} ×${p.qty} = ${rm(p.rev)}`));L.push(`Total items: ${prods.reduce((s,p)=>s+p.qty,0)}`)}
  if(role==='admin'){
    const ex=S.expenses.filter(e=>e.date===date), cost=ex.reduce((s,e)=>s+e.amount,0);
    L.push('',`*Expenses: ${rm(cost)}*`);ex.forEach(e=>L.push(`• ${e.cat}${e.note?' ('+e.note+')':''} = ${rm(e.amount)}`));
    L.push(`*Profit: ${rm(sales-cost)}*`);
    if(S.target)L.push(`Target: ${rm(S.target)} (${Math.round(sales/S.target*100)}%)`);
  }
  const extra=[];
  if(live.length){const c={};live.forEach(o=>{const h=new Date(o.ts).getHours();c[h]=(c[h]||0)+1});const [h,n]=Object.entries(c).sort((x,y)=>y[1]-x[1])[0];extra.push(`Busiest hour: ${hl(+h)}–${hl(+h+1)} (${n} orders)`)}
  if(date===today())S.items.filter(i=>i.stock&&i.active).forEach(i=>extra.push(`${i.name} left: ${i.qty}`));
  if(extra.length)L.push('',...extra);
  L.push('',`Sent by ${role==='admin'?'Admin':'Staff'} at ${tm(Date.now())}`);
  return L.join('\n');
}

function restoreFrom(file){
  const rd=new FileReader();
  rd.onload=()=>{
    let b;try{b=JSON.parse(rd.result)}catch(e){toast('That file is not a Kepokkaw backup');return}
    const d=b&&b.app==='kepokkaw-pos'&&b.data;
    if(!d||!Array.isArray(d.items)||!Array.isArray(d.orders)||!Array.isArray(d.expenses)){toast('That file is not a Kepokkaw backup');return}
    ask('Restore this backup?',`Backup from ${dlabel(dkey(new Date(b.exported)))}, ${tm(b.exported)} with ${d.orders.length} orders and ${d.expenses.length} expenses. Everything on this device is replaced.`,'Restore',()=>{S=d;S.moves=S.moves||[];cart={};logA('Restored backup','from '+dlabel(dkey(new Date(b.exported)))+', '+tm(b.exported));save();render();toast('Backup restored')});
  };
  rd.readAsText(file);
}

    const it=item(t.dataset.edit),f=t.dataset.f;
    if(f==='price'){const v=parseFloat(t.value);if(!(v>=0)){toast('Price must be a number');t.value=it.price;return}const old=it.price;it.price=Math.round(v*100)/100;if(old!==it.price)logA('Changed price',`${it.name}: ${rm0(old)} → ${rm0(it.price)}`)}
    else if(f==='name'){const v=t.value.trim();if(!v){t.value=it.name;return}if(v!==it.name)logA('Renamed item',`${it.name} → ${v}`);it.name=v}
    else if(f==='active'){it.active=t.checked;logA(t.checked?'Added to menu':'Removed from menu',it.name)}
    else if(f==='stock'){it.stock=t.checked;if(t.checked&&typeof it.qty!=='number')it.qty=0;logA(t.checked?'Stock tracking on':'Stock tracking off',it.name)}
    else if(f==='cat'){if(it.cat!==t.value)logA('Changed category',`${it.name}: ${it.cat} → ${t.value}`);it.cat=t.value}
    else it[f]=t.value;
    save();toast('Saved');
  }
});

function wake(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}}
applyTheme();
load().then(()=>{
  try{const r=localStorage.getItem(LS_ROLE);if(r==='admin'||r==='staff')role=r}catch(e){}
  const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h))view=h;
  render();wake();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake();if(S)render();if(swReg)swReg.update().catch(()=>{})}});
if('serviceWorker' in navigator){
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController)showUpdate()});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{}));
}
})();
</script>
