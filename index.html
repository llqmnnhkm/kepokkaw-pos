<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kepokkaw Cashier</title>
<meta name="theme-color" content="#E1251B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kepokkaw">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Kepok Kaw<small>Cashier</small></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="who"><button class="themebtn" id="themeBtn" data-act="theme" aria-label="Switch light or dark"></button><span class="role" id="roleChip">Admin</span><button class="lock" data-act="lock" id="lockBtn" aria-label="Switch user"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M17 9h5m-2-2 2 2-2 2"/></svg><span class="lbl">Switch user</span></button></div>
  </header>
  <div class="checker" aria-hidden="true"></div>
  <div class="sample upd" id="updateBar" hidden><span><b>New version ready.</b> Reload to start using it.</span><button class="ghost" data-act="reload">Reload</button></div>
  <div class="sample" id="sampleBar" hidden><b>Sample data.</b> <span class="long">These are made-up sales from the last 14 days, so you can try the dashboard. Clear them in Settings before you use it for real.</span><span class="short">Made-up sales. Clear them in Settings before real use.</span></div>
  <div class="sample" id="backupBar" hidden></div>
  <div class="sample" id="syncBar" hidden></div>
  <main id="main"></main>
  <nav class="btabs" id="btabs" aria-label="Screens"></nav>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="pin" id="pin" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="xlsx.js"></script>
<script src="pdf.js"></script>
<script src="firebase-config.js"></script>
<script src="js/core.js"></script>
<script src="js/cashier.js"></script>
<script src="js/orders.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/expenses.js"></script>
<script src="js/stock.js"></script>
<script src="js/settings.js"></script>
<script src="js/reports.js"></script>
<script src="js/signin.js"></script>
<script src="js/main.js"></script>
</body>
</html>
